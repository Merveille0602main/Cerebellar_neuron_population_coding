[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "braincell-cerebellar-reproduction"
version = "0.1.0"
description = "Export a BSB cerebellar-column reconstruction into a BrainCell-ready network specification."
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26",
]

[project.optional-dependencies]
braincell-runtime = ["braincell==0.1.0+reproduction.1"]
neuron-validation = [
  "neuron==9.0.2",
]

[project.scripts]
cerebellar-export = "cerebellar_reproduction.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
